name: Arsenal Master Quant V18.3

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '30 12 * * *'
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar_datos:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar Python del Servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librerias Necesarias
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai pillow

      - name: 1. Descargar Partidos, Cuotas y Contexto Real
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python motor_api_real.py

      - name: 2. Ejecutar Cerebro V18.3 y Enviar a Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_FREE_CHAT_ID: ${{ secrets.TELEGRAM_FREE_CHAT_ID }}
          LINK_SUSCRIPCION_VIP: ${{ secrets.LINK_SUSCRIPCION_VIP }}
          PANEL_WEB_URL: ${{ secrets.PANEL_WEB_URL }}
        run: |
          python bot_cuantico_profesional.py

      - name: 3. Guardar Historial en GitHub Sin Conflictos
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add predicciones/ www/
          if ! git diff --staged --quiet; then
            git commit -m "Cartelera V18.3 Completa [Automation]"
            git pull --rebase --autostash origin main || true
            git push
          fi
          
