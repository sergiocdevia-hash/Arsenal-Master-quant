name: Motor Arsenal Flashscore Diario

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  procesar_datos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4

      - name: Configurar Python del Servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librerias Necesarias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 1. Descargar Partidos Reales API
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python motor_api_real.py

      - name: 2. Analizar y Publicar en Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot_cuantico_profesional.py

      - name: 3. Guardar Historial en GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Cartelera y alerta Telegram [Automation]"
          file_pattern: 'predicciones/*'
