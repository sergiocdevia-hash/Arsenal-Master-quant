name: Motor Arsenal Flashscore Diario

on:
  schedule:
    - cron: '0 5 * * *' # Se ejecuta todos los días a las 05:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  procesar_datos:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Permite al flujo escribir y hacer push de archivos en el repositorio

    steps:
      - name: Descargar codigo de GitHub
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.LLAVE_ACCESO }}

      - name: Configurar Python del Servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Librerias Necesarias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Conectar API y Procesar Predicciones Arsenal
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python motor_api_real.py

      - name: Subir Resultados a la Web Automatycally
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Cartelera limpia del dia"
          file_pattern: 'predicciones/*'
