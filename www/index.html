<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARSENAL MASTER QUANT V18.1 - PREMIUM</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #070d14; color: #e2e8f0; padding: 14px; max-width: 600px; margin: 0 auto; }
    .header { text-align: center; padding: 16px 10px; border-bottom: 1px solid #133b4a; margin-bottom: 16px; }
    .header h1 { color: #00f0c8; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
    .header p { color: #94a3b8; font-size: 12px; margin-top: 6px; }
    .liga-btn {
      width: 100%; background: #0d1724; border: 1px solid #00c8a8; border-radius: 8px;
      padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between;
      align-items: center; cursor: pointer; color: #00f0c8; font-weight: 700; font-size: 13px;
    }
    .liga-btn span.count { color: #00f0c8; }
    .partidos-box { display: none; margin-bottom: 16px; }
    .partidos-box.open { display: block; }
    .card {
      background: #0d1926; border: 1px solid #163245; border-radius: 10px;
      padding: 14px; margin-bottom: 12px;
    }
    .match-title {
      color: #38bdf8; font-weight: 700; font-size: 15px; border-left: 3px solid #00f0c8;
      padding-left: 8px; margin-bottom: 12px; display: flex; justify-content: space-between;
    }
    .match-time { color: #94a3b8; font-size: 12px; font-weight: 400; }
    .row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; font-size: 12.5px; }
    .label { color: #94a3b8; flex: 1; }
    .val { font-weight: 700; text-align: right; flex: 1.2; }
    .cyan { color: #00f0c8; }
    .white { color: #ffffff; }
    .gold { color: #facc15; }
    .red { color: #f87171; }
    .ia-box {
      margin-top: 10px; padding-top: 10px; border-top: 1px dashed #163245;
      font-size: 12px; color: #cbd5e1; line-height: 1.4;
    }
    .loading { text-align: center; color: #00f0c8; padding: 40px 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>ARSENAL MASTER QUANT V18.1 - PREMIUM</h1>
    <p id="subtitulo">Cargando cartelera cuántica en vivo...</p>
  </div>
  <div id="contenedor" class="loading">Sincronizando motores...</div>

  <script>
    async function cargarCartelera() {
      try {
        const res = await fetch('datos/partidos_del_dia.json?v=' + Date.now());
        const data = await res.json();
        const cont = document.getElementById('contenedor');
        cont.className = '';
        cont.innerHTML = '';

        const listaPartidos = Object.values(data.partidos || {});
        if (listaPartidos.length === 0) {
          document.getElementById('subtitulo').innerText = `Actualizado: ${data.actualizado || 'Hoy'} • 0 Partidos con +EV`;
          cont.className = 'loading';
          cont.innerText = 'Sin señales con valor matemático positivo (+EV) tras filtrar entropía y comité IA.';
          return;
        }

        // Agrupar partidos por liga manteniendo el diseño desplegable
        const porLiga = {};
        listaPartidos.forEach(p => {
          const nombreLiga = p.liga || 'LIGA VIP';
          if (!porLiga[nombreLiga]) porLiga[nombreLiga] = [];
          porLiga[nombreLiga].push(p);
        });

        const ligas = Object.keys(porLiga);
        let total = listaPartidos.length;

        ligas.forEach((liga, idx) => {
          const partidos = porLiga[liga];

          const btn = document.createElement('button');
          btn.className = 'liga-btn';
          btn.innerHTML = `<span>${liga}</span><span class="count">[ ${partidos.length} PARTIDOS ]</span>`;

          const box = document.createElement('div');
          box.className = 'partidos-box';
          if (idx === 0) box.classList.add('open');

          btn.onclick = () => box.classList.toggle('open');

          partidos.forEach(p => {
            const horaCol = (p.fecha && p.fecha.includes('T')) ? p.fecha.split('T')[1].substring(0, 5) : '';
            const evColor = (p.ev >= 5) ? 'cyan' : 'gold';
            const entropiaColor = (p.entropia <= 0.65) ? 'cyan' : 'gold';

            box.innerHTML += `
              <div class="card">
                <div class="match-title">
                  <span>${p.local} VS ${p.visitante}</span>
                  <span class="match-time">${horaCol ? horaCol + ' COL' : ''}</span>
                </div>
                <div class="row"><span class="label">📋 PREDICCIÓN ARSENAL:</span><span class="val cyan">[${p.prediccion}]</span></div>
                <div class="row"><span class="label">💰 CUOTA REAL MULTIBARRIDO:</span><span class="val white">${Number(p.cuota).toFixed(2)}</span></div>
                <div class="row"><span class="label">🧠 PROBABILIDAD BAYESIANA:</span><span class="val white">${p.probabilidad}%</span></div>
                <div class="row"><span class="label">📈 VALOR ESPERADO (+EV):</span><span class="val ${evColor}">+${p.ev}%</span></div>
                <div class="row"><span class="label">💵 GESTIÓN DE CAPITAL:</span><span class="val gold">Stake Kelly: ${p.stake}%</span></div>
                <div class="row"><span class="label">🌀 ENTROPÍA DEL MERCADO:</span><span class="val ${entropiaColor}">${p.entropia}</span></div>
                <div class="row"><span class="label">⚡ CONTEXTO VIVO:</span><span class="val cyan">[MOTOR QUANT V18.1 ON]</span></div>
                ${p.resumen_ia ? `<div class="ia-box">🤖 <strong>COMITÉ IA:</strong> ${p.resumen_ia}</div>` : ''}
              </div>
            `;
          });

          cont.appendChild(btn);
          cont.appendChild(box);
        });

        document.getElementById('subtitulo').innerText = `${ligas.length} Ligas Activas • ${total} Partidos Analizados (${data.actualizado || ''})`;
      } catch (e) {
        document.getElementById('contenedor').innerText = 'Error cargando los partidos del día.';
      }
    }
    cargarCartelera();
  </script>
</body>
</html>
